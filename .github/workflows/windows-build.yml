name: Build RavenXD Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package launcher
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $exe = "build\Release\RavenXD_Launcher.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "ERROR: Launcher EXE not found: $exe"
            Get-ChildItem -Path build -Filter *.exe -Recurse | Select-Object FullName
            exit 1
          }
          Copy-Item $exe "package\RavenXD-Launcher.exe" -Force
          if (Test-Path "build\Release\data") {
            Copy-Item "build\Release\data" "package\data" -Recurse -Force
          } elseif (Test-Path "data") {
            Copy-Item "data" "package\data" -Recurse -Force
          }
          if (Test-Path "build\Release\assets") {
            Copy-Item "build\Release\assets" "package\assets" -Recurse -Force
          } elseif (Test-Path "assets") {
            Copy-Item "assets" "package\assets" -Recurse -Force
          }
          Get-ChildItem package -Recurse | Select-Object FullName

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavenXD-Launcher-Windows-x64
          path: package
          if-no-files-found: error
